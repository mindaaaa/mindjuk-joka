<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 파비콘 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 기본 메타 -->
    <title>JOKA — 우리 아이 사진 앨범</title>
    <meta name="description" content="가족만을 위한 작은 사진 앨범. 메신저와 클라우드에 흩어진 아이 사진을 한 곳에 모아보세요." />
    <meta name="theme-color" content="#0066ff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JOKA" />
    <meta property="og:title" content="JOKA — 우리 아이 사진 앨범" />
    <meta property="og:description" content="가족만을 위한 작은 사진 앨범. 흩어진 아이 사진을 한 곳에 모아보세요." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <!-- TODO: 배포 도메인 확정 후 절대 URL로 교체 (og:url, og:image는 절대경로 권장) -->
    <meta property="og:url" content="https://example.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JOKA — 우리 아이 사진 앨범" />
    <meta name="twitter:description" content="가족만을 위한 작은 사진 앨범. 흩어진 아이 사진을 한 곳에 모아보세요." />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
