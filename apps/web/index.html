<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 첫 페인트 전에 테마 클래스 확정 (다크모드 FOUC 방지) -->
    <script>
      (function () {
        try {
          const STORAGE_KEY = 'joka-theme';
          const storedTheme = localStorage.getItem(STORAGE_KEY);
          const isValidStoredTheme =
            storedTheme === 'light' || storedTheme === 'dark';
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)',
          ).matches;

          let theme;
          if (isValidStoredTheme) {
            theme = storedTheme;
          } else {
            theme = prefersDark ? 'dark' : 'light';
          }

          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- 파비콘 -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- 기본 메타 -->
    <title>JOKA — 우리 아이 사진 앨범</title>
    <meta
      name="description"
      content="가족만을 위한 작은 사진 앨범. 메신저와 클라우드에 흩어진 아이 사진을 한 곳에 모아보세요."
    />
    <meta
      name="theme-color"
      content="#0066ff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0a0a0a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="JOKA" />
    <meta property="og:title" content="JOKA — 우리 아이 사진 앨범" />
    <meta
      property="og:description"
      content="가족만을 위한 작은 사진 앨범. 흩어진 아이 사진을 한 곳에 모아보세요."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://joka.mindjuk.quest/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="JOKA — 우리 아이 사진 앨범" />
    <meta
      name="twitter:description"
      content="가족만을 위한 작은 사진 앨범. 흩어진 아이 사진을 한 곳에 모아보세요."
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="splash-overlay" role="presentation">
      <style>
        #splash-overlay {
          position: fixed;
          inset: 0;
          z-index: 9999;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 26px;
          background: linear-gradient(
            180deg,
            #0151cd 0%,
            #0166ff 50%,
            #3c8bff 100%
          );
          opacity: 1;
          transition: opacity 0.25s ease;
        }
        #splash-overlay .joka-dots {
          display: grid;
          grid-template-columns: repeat(3, 15px);
          grid-template-rows: repeat(3, 15px);
          gap: 7px;
        }
        #splash-overlay .joka-dots i {
          display: block;
          width: 15px;
          height: 15px;
          border-radius: 4px;
          background: #ffffff;
          opacity: 0.3;
          animation: joka-pulse 1.3s ease-in-out infinite;
        }
        #splash-overlay .joka-dots i:nth-child(1) {
          animation-delay: 0s;
        }
        #splash-overlay .joka-dots i:nth-child(2) {
          animation-delay: 0.12s;
        }
        #splash-overlay .joka-dots i:nth-child(3) {
          animation-delay: 0.24s;
        }
        #splash-overlay .joka-dots i:nth-child(4) {
          animation-delay: 0.12s;
        }
        #splash-overlay .joka-dots i:nth-child(5) {
          animation-delay: 0.24s;
        }
        #splash-overlay .joka-dots i:nth-child(6) {
          animation-delay: 0.36s;
        }
        #splash-overlay .joka-dots i:nth-child(7) {
          animation-delay: 0.24s;
        }
        #splash-overlay .joka-dots i:nth-child(8) {
          animation-delay: 0.36s;
        }
        #splash-overlay .joka-dots i:nth-child(9) {
          animation-delay: 0.48s;
        }
        #splash-overlay .joka-word {
          color: #ffffff;
          font-family:
            -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
            'Helvetica Neue', Arial, sans-serif;
          font-size: 32px;
          font-weight: 500;
          /* letter-spacing이 만든 우측 여백을 text-indent로 상쇄해 시각적 중앙 정렬 유지 */
          letter-spacing: 0.18em;
          text-indent: 0.18em;
        }
        @keyframes joka-pulse {
          0%,
          100% {
            opacity: 0.3;
          }
          50% {
            opacity: 1;
          }
        }
        @media (prefers-reduced-motion: reduce) {
          #splash-overlay .joka-dots i {
            animation: none;
            opacity: 0.85;
          }
        }
      </style>
      <div class="joka-dots" aria-hidden="true">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="joka-word" aria-hidden="true">JOKA</div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/app/index.tsx"></script>
  </body>
</html>
