# Workers 관련
name = "nail-artist"
main = "src/index.ts"
compatibility_flags = ["nodejs_compat"]
compatibility_date = "2024-09-23"

# workers.dev 서브도메인 유지 (로컬용)
workers_dev = true

# Hyperdrive (joka-api와 동일 prod DB 설정을 재사용)
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "b620191d4d484662be45eff46fd9b692"
localConnectionString = "postgres://admin:my-very-secure-pw@localhost:5432/mindjuk"

# Cloudflare Images 바인딩
[images]
binding = "IMAGES"

# 썸네일 추출 큐 consumer 바인딩(producer는 joka-api)
# 재시도 없음(max_retries=0) + always-ack: Images 재과금 원천 차단.
# dead_letter_queue 미도입(놓친 썸네일은 thumbnail=null로 남고 백필로 복구).
[[queues.consumers]]
queue = "thumbnail-jobs"
max_batch_size = 10
max_batch_timeout = 10
max_concurrency = 2
max_retries = 0

# 로컬 관련
[dev]
port = 54862
local_protocol = "http"
