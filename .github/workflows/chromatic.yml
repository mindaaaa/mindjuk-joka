name: Chromatic

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  chromatic:
    name: Run Chromatic
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Chromatic
        id: chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          onlyChanged: true
          exitZeroOnChanges: true

      - name: Comment Storybook preview URL on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: chromatic-preview
          message: |
            ### 📚 Storybook Preview

            - **Preview URL**: ${{ steps.chromatic.outputs.storybookUrl }}
            - **Build URL**: ${{ steps.chromatic.outputs.buildUrl }}

            > Chromatic이 자동 배포한 Storybook 미리보기예요. 변경사항/Visual diff는 Build URL에서 검토할 수 있습니다.
